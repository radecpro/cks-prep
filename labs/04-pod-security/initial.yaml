apiVersion: v1
kind: ConfigMap
metadata:
  name: status-page
data:
  index.html: "cks-lab-04-ready\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status
  template:
    metadata:
      labels:
        app: status
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: busybox:1.37.0
          command: [httpd]
          args: [-f, -p, '8080', -h, /www]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add: [NET_ADMIN]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          volumeMounts:
            - name: page
              mountPath: /www
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: status-page
---
apiVersion: v1
kind: Service
metadata:
  name: status
spec:
  selector:
    app: status
  ports:
    - port: 8080
      targetPort: 8080
